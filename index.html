  <style>
    :root {
      --bg: #fafafa;
      --fg: #0a0a0a;
      --strong: #0a0a0a;
      --muted: #525252;
      --subtle: #737373;
      --border: #e5e5e5;
      --surface: #ffffff;
      --surface-subtle: #f5f5f5;
      --hairline: #d4d4d4;
      --accent: #a855f7;
      --accent-light: #c084fc;
      --accent-hover: #e9d5ff;
      --accent-arrow: #d8b4fe;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --strong: #fafafa;
      --muted: #a3a3a3;
      --subtle: #737373;
      --border: #262626;
      --surface: #141414;
      --surface-subtle: #1a1a1a;
      --hairline: #404040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Instrument Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 40;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--subtle);
      cursor: pointer;
      transition: color 0.2s;
    }

    .theme-toggle:hover { color: var(--strong); }
    .theme-toggle svg { width: 1.875rem; height: 1.875rem; }

    .hero {
      max-width: 24rem;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 1.5rem;
    }

    .hero h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--strong);
    }

    .hero h1 a:hover { opacity: 0.8; }

    .tagline {
      margin-top: 0.25rem;
      font-size: 0.875rem;
      line-height: 1.5rem;
      color: var(--subtle);
    }

    nav {
      margin-top: 4rem;
      display: flex;
      flex-direction: column;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      color: var(--muted);
      transition: color 0.2s;
      animation: fadeUp 0.6s ease both;
    }

    .nav-link:hover { color: var(--strong); }

    .nav-link .arrow {
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.2s;
      color: var(--subtle);
    }

    .nav-link:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      bottom: 0.5rem;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--hairline);
      transition: width 0.3s;
    }

    .nav-link:hover::after { width: 100%; }

    .nav-link.accent { color: var(--accent-light); }
    .nav-link.accent:hover { color: var(--accent-hover); }
    .nav-link.accent .arrow { color: var(--accent-arrow); }
    .nav-link.accent::after { background: var(--accent); }

    .social {
      margin-top: 3rem;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    .social-icons {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      color: var(--muted);
      transition: color 0.2s;
    }

    .social-link:hover { color: var(--strong); }
    .social-link svg { width: 1.5625rem; height: 1.5625rem; }

    .followers {
      margin-top: 1.25rem;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--muted);
    }

    .scroll-hint {
      margin-top: 3.5rem;
      text-align: center;
      animation: fadeUp 0.6s ease 0.35s both;
    }

    .scroll-hint a {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--subtle);
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .scroll-hint a:hover { opacity: 1; }
    .scroll-hint svg { width: 0.875rem; height: 0.875rem; transition: transform 0.2s; }
    .scroll-hint a:hover svg { transform: translateY(2px); }

    .videos {
      max-width: 64rem;
      margin: 0 auto;
      padding: 0 1.25rem 5rem;
      scroll-margin-top: 2.5rem;
    }

    .videos-header {
      max-width: 24rem;
      margin: 0 auto;
      text-align: center;
    }

    .videos-header p {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--subtle);
    }

    .videos-header h2 {
      margin-top: 1rem;
      font-size: 1.5rem;
      line-height: 2.25rem;
      letter-spacing: -0.02em;
      color: var(--strong);
    }

    .video-grid {
      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .video-grid { grid-template-columns: 1fr 1fr; }
    }

    .video-card {
      overflow: hidden;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color 0.2s;
      animation: fadeUp 0.6s ease both;
    }

    .video-card:hover { border-color: var(--strong); }

    .video-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--surface-subtle);
      overflow: hidden;
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .video-card:hover .video-thumb img { transform: scale(1.02); }

    .video-body { padding: 1rem; }

    .video-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--subtle);
    }

    .video-title {
      margin-top: 1rem;
      font-size: 0.875rem;
      line-height: 1.5rem;
      color: var(--strong);
    }

    .video-meta {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
    }

    .video-meta .views { font-weight: 500; color: var(--strong); }

    .video-meta .arrow {
      opacity: 0;
      transform: translateX(-4px);
      color: var(--subtle);
      transition: all 0.2s;
    }

    .video-card:hover .video-meta .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    footer {
      margin-top: auto;
      border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      padding: 2rem 1.25rem;
      font-size: 0.75rem;
      color: var(--subtle);
    }

    footer .inner {
      max-width: 72rem;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }

    @media (min-width: 640px) {
      footer .inner { justify-content: flex-end; }
    }

    footer a {
      font-weight: 500;
      color: var(--muted);
      transition: color 0.2s;

    footer a:hover { color: var(--strong); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

      { tag: "Codex workflow stack", title: "7 Tools That Make Codex 10x MORE Powerful", views: "58,543", url: "https://www.youtube.com/watch?v=SNAlFLV9MBE", thumb: "https://i.ytimg.com/vi/SNAlFLV9MBE/hqdefault.jpg" }
    ];

    document.getElementById("video-grid").innerHTML = videos.map((v, i) => `
      <a class="video-card" href="${v.url}" target="_blank" rel="noreferrer" style="animation-delay:${(i + 1) * 50}ms">
        <div class="video-thumb"><img src="${v.thumb}" alt="${v.title} thumbnail" loading="lazy" /></div>
        <div class="video-body">
          <p class="video-tag">${v.tag}</p>
          <h3 class="video-title">${v.title}</h3>
          <div class="video-meta">
            <p class="views">${v.views} views</p>
            <span class="arrow">→</span>
          </div>
        </div>
      </a>
    `).join("");

    const toggle = document.getElementById("theme-toggle");
    const moon = toggle.querySelector(".icon-moon");
    const sun = toggle.querySelector(".icon-sun");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      moon.style.display = theme === "dark" ? "none" : "block";
      sun.style.display = theme === "dark" ? "block" : "none";
      toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
    }

    try {
      const saved = localStorage.getItem("theme");
      applyTheme(saved === "light" ? "light" : "dark");
    } catch {
      applyTheme("dark");
    }

    toggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch {}
    });
  </script>
</body>
</html>
